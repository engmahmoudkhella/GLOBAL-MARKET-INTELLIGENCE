name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Guards (no real trading, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Forbid real-money execution code (SRS §19.1)
        run: python scripts/check_no_real_trading.py .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, types, unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_USER: gmi
          POSTGRES_PASSWORD: gmi
          POSTGRES_DB: gmi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gmi" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults:
      run: { working-directory: backend }
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gmi:gmi@localhost:5432/gmi
      GMI_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.x" }
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Tests (integration tests must not be skipped in CI)
        run: uv run pytest -q -rs | tee pytest.log && ! grep -q "SKIPPED" pytest.log

  frontend:
    name: Frontend (lint, types, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_USER: gmi
          POSTGRES_PASSWORD: gmi
          POSTGRES_DB: gmi_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gmi" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      GMI_DATABASE_URL: postgresql+psycopg://gmi:gmi@localhost:5432/gmi_e2e
      GMI_REDIS_URL: redis://localhost:6379/0
      GMI_COOKIE_SECURE: "false"
      GMI_ENVIRONMENT: development
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: e2e-only-password-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.x" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Backend up (migrate, create e2e user, serve)
        working-directory: backend
        run: |
          uv python install 3.12 && uv sync --frozen --no-dev
          uv run alembic upgrade head
          echo "$E2E_PASSWORD" | uv run python -m app.cli create-user --email "$E2E_EMAIL" --name "E2E" --role admin --password-stdin
          GMI_E2E_SEED=1 uv run python -m tests.e2e_seed
          nohup uv run uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          # wait-on must use GET (http-get://): FastAPI GET routes answer HEAD with 405.
          npx --yes wait-on --timeout 60000 http-get://127.0.0.1:8000/health/live
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm lint
      - working-directory: frontend
        run: pnpm typecheck
      - working-directory: frontend
        run: pnpm build
      - name: Playwright e2e (AR/EN, RTL/LTR, desktop + mobile)
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          API_INTERNAL_URL=http://localhost:8000 nohup pnpm start -p 3000 > ../web.log 2>&1 &
          npx --yes wait-on --timeout 120000 http-get://127.0.0.1:3000/ar/login
          pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            api.log
            web.log
            frontend/playwright-report
            frontend/test-results
