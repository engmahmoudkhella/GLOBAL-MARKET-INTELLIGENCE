# Global Market Intelligence - local / single-VPS stack.
#   cp .env.example .env   # then edit secrets
#   docker compose up -d --build
#   docker compose run --rm api python -m app.cli create-user --email you@example.com --name Owner --role admin
# Only nginx publishes a port. Paper trading only - no real-money execution exists.

x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/backend.Dockerfile
  image: gmi-backend:local
  env_file: .env
  environment:
    GMI_DATABASE_URL: postgresql+psycopg://gmi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/gmi
    GMI_REDIS_URL: redis://redis:6379/0
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.31.0-pg16
    environment:
      POSTGRES_USER: gmi
      POSTGRES_DB: gmi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmi -d gmi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    image: gmi-frontend:local
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/gmi.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GMI_HTTP_PORT:-8080}:80"
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
