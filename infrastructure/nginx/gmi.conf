# Reverse proxy: one origin for the browser. /api and /health -> FastAPI, everything else -> Next.js.
# TLS: terminate here in production (see docs/DEPLOYMENT.md). This file serves plain HTTP for
# local development; the production override adds the 443 server block.

limit_req_zone $binary_remote_addr zone=gmi_api:10m rate=20r/s;

upstream gmi_api { server api:8000; }
upstream gmi_web { server web:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/docs { return 404; }

    location /api/ {
        limit_req zone=gmi_api burst=40 nodelay;
        proxy_pass http://gmi_api;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://gmi_api;
    }

    location / {
        proxy_pass http://gmi_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
